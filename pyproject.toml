[project]
name = "webshare"
version = "0.7.0"
description = "LAN file sharing HTTP server using the Python standard library"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
webshare = "webshare:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
